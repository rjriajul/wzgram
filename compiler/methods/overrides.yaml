# Method generator overrides
# Maps TL function names to high-level method generation rules.
# Fields:
#   category:     subdirectory under pyrogram/methods/
#   usable_by:    "users-bots" or "users" or "bots"
#   response_pattern: "updates" | "list" | "single" | "none" | "custom"
#   peer_param:   which parameter needs resolve_peer() (usually chat_id)
#   skip_if_exists: true = never overwrite existing handwritten file
#   template:     "simple" or "complex" (default: "simple")
#
# When a TL function has no override, no method is generated.

# ── Messages ──────────────────────────────────────────────────────

send_message:
  category: messages
  usable_by: users-bots
  response_pattern: updates
  peer_param: chat_id
  skip_if_exists: true
  extra_params:
    - name: text
      type: str
      doc: Text of the message to send
    - name: parse_mode
      type: Optional["enums.ParseMode"]
      default: None
    - name: entities
      type: List["types.MessageEntity"]
      default: None
    - name: disable_web_page_preview
      type: bool
      default: None
    - name: disable_notification
      type: bool
      default: None
    - name: reply_to_message_id
      type: int
      default: None
    - name: schedule_date
      type: datetime
      default: None
    - name: protect_content
      type: bool
      default: None
    - name: reply_markup
      type: "Union[types.InlineKeyboardMarkup, types.ReplyKeyboardMarkup, types.ReplyKeyboardRemove, types.ForceReply]"
      default: None
  raw_function: messages.SendMessage

send_dice:
  category: messages
  usable_by: users-bots
  response_pattern: updates
  peer_param: chat_id
  skip_if_exists: true
  extra_params:
    - name: emoji
      type: str
      default: "\U0001F3B2"
      doc: "Dice emoji (\U0001F3B2, \U0001F3AF, \U0001F3C0, etc.)"
    - name: disable_notification
      type: bool
      default: None
    - name: reply_to_message_id
      type: int
      default: None
    - name: schedule_date
      type: datetime
      default: None
    - name: protect_content
      type: bool
      default: None
    - name: reply_markup
      type: "Union[...]"
      default: None
  raw_media_type: InputMediaDice
  media_mapping:
    emoticon: emoji

